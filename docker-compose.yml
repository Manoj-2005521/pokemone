services:
  bot:
    build: .
    container_name: pokedex-go-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "10000:10000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    environment:
      - DB_PATH=/app/data/pokedex.db
      - BACKUP_DIR=/app/backups
